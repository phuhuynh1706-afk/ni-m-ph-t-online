<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niệm Phật Online – Chùa Trấn Hộ</title>
<style>
:root{--gold:#f0c566;--gold2:#c8932f;--ink:#2a0f08;--panel:rgba(48,18,10,.88);--line:rgba(240,197,102,.35);--fg:#fbeed0;--mut:#d3b98a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a0f08;color:var(--fg);font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
.hud{position:absolute;pointer-events:none}.hud *{pointer-events:auto}
#prof{left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:8px 14px 8px 8px;display:flex;gap:10px;align-items:center;min-width:210px}
.av{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffd9e6,#c7547f);display:grid;place-items:center;font-size:22px}
#prof b{display:block;font-size:.95rem}#prof small{color:var(--mut);font-size:.75rem}
.lv{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:700;display:grid;place-items:center}
.bar{height:5px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold)}
#temple{left:14px;top:74px;font-weight:700;font-size:1.05rem;text-shadow:0 1px 3px #000}
#online{left:14px;top:100px;font-size:.8rem;color:#c8f0c8;text-shadow:0 1px 3px #000}
#ticker{left:50%;top:44%;transform:translateX(-50%);background:rgba(0,0,0,.45);border-radius:14px;padding:3px 12px;font-size:.8rem;white-space:nowrap;opacity:0;transition:opacity .4s;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#res{right:10px;top:10px;display:flex;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 12px;font-weight:600;color:var(--fg);font:inherit;cursor:pointer}
#panel{right:10px;top:56px;width:min(330px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:none;max-height:calc(100% - 330px)}
#panel.on{display:flex;flex-direction:column}
#panel h2{margin:0;font-size:1.1rem}#panel small{color:var(--mut)}
#wl{overflow:auto;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.w{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;font-size:.85rem}.w i{display:block;font-family:Georgia,serif}.w b{display:block;color:var(--gold);margin-top:2px;font-size:.8rem}
.w button{float:right;margin-top:-26px;background:rgba(255,255,255,.12);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:3px 10px;cursor:pointer}
.gold{background:linear-gradient(#f6d27a,#d29b32);color:var(--ink);border:0;border-radius:24px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
#wi{display:none;gap:6px;margin-bottom:8px}#wi input{flex:1;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--fg);padding:8px;font:inherit}
#acts{right:10px;bottom:84px;display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.ab,.mb{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem}
.ab{height:64px}.ab span,.mb span{font-size:1.35rem}.ab[aria-pressed="true"],.mb[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.ab:disabled{opacity:.45}
#menu{left:0;right:0;bottom:6px;display:flex;gap:6px;overflow-x:auto;padding:0 10px;justify-content:safe center}
.mb{min-width:62px;height:58px;flex:none}
.pop{position:absolute;pointer-events:none;font-weight:700;color:var(--gold);text-shadow:0 1px 4px #000;animation:up 1.1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-90px}}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:9}
#modal.on{display:grid}
#mbox{background:#3a150b;border:1px solid var(--line);border-radius:16px;padding:18px;width:min(380px,92vw);max-height:80vh;overflow:auto}
#mbox h2{margin:0 0 10px}.rk{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1)}
#mbox input[type=text]{width:100%;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--fg);padding:8px;font:inherit;margin:6px 0 12px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:600px){#acts{grid-template-columns:repeat(3,56px);bottom:76px}.ab{height:56px}#panel{max-height:34%}}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Chạm để niệm Phật"></canvas>

<div class="hud" id="prof"><div class="av">🪷</div><div style="flex:1"><b id="pn">Đạo hữu</b><small id="pl">Hạt sen · bậc 1</small><div class="bar"><i id="pb"></i></div></div><div class="lv" id="lv">1</div></div>
<div class="hud" id="temple">Chùa Trấn Hộ</div>
<div class="hud" id="online">● 0 đang online</div>
<div class="hud" id="ticker"></div>
<div class="hud" id="res"><span class="chip">🪷 <span id="sen">0</span></span><button class="chip" id="lampBtn" aria-label="Đèn nguyện">🏮</button></div>

<div class="hud" id="panel">
  <h2>Đèn nguyện</h2><small id="lc">0 ngọn đèn đang sáng</small>
  <div id="wl"></div>
  <div id="wi"><input id="wt" maxlength="60" placeholder="Nguyện cho gia đình bình an…"><button class="gold" id="wsend">Gửi</button></div>
  <button class="gold" id="wbtn">🏮 Thả đèn nguyện</button>
</div>

<div class="hud" id="acts">
  <button class="ab" id="bow"><span>🙏</span>Lạy Phật</button>
  <button class="ab" id="beadB"><span>📿</span>Trạng hạt</button>
  <button class="ab" id="auto" aria-pressed="false"><span>📖</span>Tụng kinh</button>
  <button class="ab" id="med"><span>🧘</span>Thiền</button>
  <button class="ab" id="off"><span>🌸</span>Dâng lễ</button>
  <button class="ab" disabled><span>🐾</span>Linh thú</button>
</div>

<div class="hud" id="menu">
  <button class="mb" data-s="soon"><span>📜</span>Nhiệm vụ</button>
  <button class="mb" data-s="soon"><span>🎒</span>Túi đồ</button>
  <button class="mb" data-s="soon"><span>🏪</span>Cửa hàng</button>
  <button class="mb" data-s="soon"><span>👥</span>Cộng đồng</button>
  <button class="mb" data-s="rank"><span>🏆</span>Xếp hạng</button>
  <button class="mb" data-s="soon"><span>🗺️</span>Bản đồ chùa</button>
  <button class="mb" id="sndB" aria-pressed="true"><span>🔔</span>Âm thanh</button>
  <button class="mb" data-s="set"><span>⚙️</span>Cài đặt</button>
</div>
<div id="modal"><div id="mbox"></div></div>

<script type="text/plain" id="gamecode">
(function(){
var $=function(i){return document.getElementById(i)};
var KEY="chua_tranho_v1",S={name:"Đạo hữu",beads:0,sen:0,lamps:0,snd:true};
try{var o=JSON.parse(localStorage.getItem(KEY)||"null");if(o)for(var k in o)S[k]=o[k];}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var N=["Mỹ Khoa","Khôi Bạch","Thanh Sơn","An Liên","Lăng Quang","Minh Tâm","Diệu Hạnh","Từ Bi","Hoa Sen","Tuệ Đăng","Bảo Châu","Nhã Hinh","Thiện Đức","Quảng Ân","Phúc Lộc"];
var SK=["#e9a36b","#d98f55","#f1bd92","#c47a45","#f4c9a5","#e2a679"],RB=["#6b86b8","#5b79ad","#7a93c2","#4f6aa0","#8aa0c9"],HR=[null,null,"#1e1410","#2c1c14"];
var bots=[],rows=[6,6,5,5,4];
rows.forEach(function(n,r){for(var c=0;c<n;c++)bots.push({r:r,c:c,n:n,name:N[(Math.random()*N.length)|0]+" "+["Sa","Nhân","Kỳ","Vân","Hạnh"][(Math.random()*5)|0],sk:SK[(Math.random()*SK.length)|0],rb:RB[(Math.random()*RB.length)|0],hr:HR[(Math.random()*HR.length)|0],ph:Math.random()*6,glow:0,beads:(Math.random()*5000)|0})});
var cv=$("cv"),g=cv.getContext("2d"),W,H,D=1,t=0,me={glow:0,bow:0};
function rs(){D=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener("resize",rs);rs();

function monk(x,y,s,m,me_){
 var bob=Math.sin(t*2+m.ph)*1.2*s+(me_?me.bow*14*s:0);y+=bob;
 g.fillStyle="#b88a55";g.beginPath();g.ellipse(x,y+34*s,62*s,20*s,0,0,7);g.fill();
 g.strokeStyle="#7a5530";g.lineWidth=2*s;g.stroke();
 if(m.glow>0){var gr=g.createRadialGradient(x,y-10*s,5,x,y-10*s,70*s);gr.addColorStop(0,"rgba(255,226,140,"+m.glow*.8+")");gr.addColorStop(1,"rgba(255,226,140,0)");g.fillStyle=gr;g.beginPath();g.arc(x,y-10*s,70*s,0,7);g.fill()}
 g.fillStyle=m.rb;g.beginPath();g.ellipse(x,y+10*s,38*s,36*s,0,0,7);g.fill();
 g.strokeStyle="#e2b24a";g.lineWidth=9*s;g.beginPath();g.moveTo(x-30*s,y-14*s);g.lineTo(x+28*s,y+30*s);g.stroke();
 g.fillStyle=m.sk;g.beginPath();g.arc(x,y-32*s,23*s,0,7);g.fill();
 if(m.hr){g.fillStyle=m.hr;g.beginPath();g.arc(x,y-35*s,24*s,Math.PI*1.02,Math.PI*1.98);g.fill();g.beginPath();g.arc(x,y-56*s,10*s,0,7);g.fill()}
 g.fillStyle="#3b2210";g.beginPath();g.arc(x-8*s,y-30*s,2.2*s,0,7);g.arc(x+8*s,y-30*s,2.2*s,0,7);g.fill();
 g.strokeStyle="#c27a3a";g.lineWidth=3*s;for(var i=0;i<9;i++){var a=Math.PI*(0.15+i*0.088);g.beginPath();g.arc(x+Math.cos(a)*26*s,y-10*s+Math.sin(a)*14*s,2.4*s,0,7);g.stroke()}
}
function label(x,y,txt,s,c){g.font="600 "+Math.max(10,12*s)+"px system-ui";g.textAlign="center";g.lineWidth=3;g.strokeStyle="rgba(0,0,0,.7)";g.strokeText(txt,x,y);g.fillStyle=c||"#fff";g.fillText(txt,x,y)}
function pos(m){var s=.5+m.r*.17,y=H*(.42+m.r*.12),sp=Math.min(W/(m.n+.6),150*s+20),x=W/2+(m.c-(m.n-1)/2)*sp+(m.r%2?sp*.25:-sp*.1);return{x:x,y:y,s:Math.min(s,H/520+.35)}}
function scene(){drawWorld();return;
 var f=g.createLinearGradient(0,0,0,H);f.addColorStop(0,"#4a1409");f.addColorStop(.35,"#2a0f08");f.addColorStop(1,"#3b1a0c");g.fillStyle=f;g.fillRect(0,0,W,H);
 g.fillStyle="#5b2410";g.fillRect(0,0,W,H*.34);
 for(var i=0;i<9;i++){g.fillStyle="rgba(200,147,47,.16)";g.fillRect(W*(i/9)+10,H*.04,6,H*.28)}
 var cx=W/2,cy=H*.2,gr=g.createRadialGradient(cx,cy,10,cx,cy,H*.28);gr.addColorStop(0,"rgba(255,220,120,.85)");gr.addColorStop(1,"rgba(255,220,120,0)");g.fillStyle=gr;g.beginPath();g.arc(cx,cy,H*.28,0,7);g.fill();
 var u=Math.min(H,W)/600;
 g.fillStyle="#7a3a14";g.fillRect(cx-150*u,cy+55*u,300*u,40*u);
 g.fillStyle="#e8b73f";g.beginPath();g.ellipse(cx,cy+32*u,80*u,34*u,0,0,7);g.fill();
 g.beginPath();g.ellipse(cx,cy-10*u,38*u,46*u,0,0,7);g.fill();
 g.fillStyle="#f6d27a";g.beginPath();g.arc(cx,cy-62*u,24*u,0,7);g.fill();
 g.fillStyle="#c8932f";g.beginPath();g.arc(cx,cy-86*u,6*u,0,7);g.fill();
 [-1,1].forEach(function(d){g.fillStyle="#f8efe0";g.fillRect(cx+d*120*u-5*u,cy+10*u,10*u,44*u);g.fillStyle="#ffb347";g.beginPath();g.ellipse(cx+d*120*u,cy+4*u+Math.sin(t*9+d)*u,5*u,9*u,0,0,7);g.fill()});
 var all=bots.map(function(m){var p=pos(m);return{m:m,p:p}});
 drawActors();return;
 var ps=Math.min(1.45,H/430+.5);monk(W/2,H*.8,ps,{rb:"#5b79ad",sk:"#f1bd92",hr:"#1e1410",ph:0,glow:me.glow},true);
 label(W/2,H*.8-78*ps,S.name,1.1,"#fff");label(W/2,H*.8-62*ps,"Cấp "+lvl(),1,"#ffe08a");
 all.forEach(function(a){if(a.m.glow>0||a.m.real)label(a.p.x,a.p.y-62*a.p.s,a.m.name,.9,"#ffe9b0")});
}
function lvl(){return 1+Math.floor(S.beads/540)}
function ui(){var b=S.beads%108;$("pn").textContent=S.name;$("pl").textContent="Hạt sen · bậc "+lvl()+" · "+b+"/108";$("lv").textContent=lvl();$("pb").style.width=(b/108*100)+"%";$("sen").textContent=S.sen;$("lc").textContent=(31+S.lamps)+" ngọn đèn đang sáng"}
var ac;function tone(f1,f2,d,v){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var T=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();o.frequency.setValueAtTime(f1,T);o.frequency.exponentialRampToValueAtTime(f2,T+d*.5);gn.gain.setValueAtTime(.0001,T);gn.gain.exponentialRampToValueAtTime(v,T+.005);gn.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(gn);gn.connect(ac.destination);o.start(T);o.stop(T+d+.02)}catch(e){}}
function pop(txt,x,y){var d=document.createElement("div");d.className="pop";d.textContent=txt;d.style.left=x+"px";d.style.top=y+"px";document.body.appendChild(d);setTimeout(function(){d.remove()},1150)}
var tk;function ticker(msg){var e=$("ticker");e.textContent="🪷 "+msg;e.style.opacity=1;clearTimeout(tk);tk=setTimeout(function(){e.style.opacity=0},4200)}
var net={room:null,db:null,uid:null,peers:{},dirty:true,rank:null};var SY=["Nam mô A Di Đà Phật","A Di Đà Phật","Nam mô Quán Thế Âm"],si=0;
function tap(){
 S.beads++;addExp(1+BD[S.bd|0].x);me.glow=1;qp("niem");if(S.beads%6===0)say(SY[si%3]);
 if(S.beads%10===0)S.sen++;
 pop(SY[si++%3]+" +1",W/2+(Math.random()*60-30),H*.62);tone(MO[S.mo|0].f,MO[S.mo|0].f/2,.28,.6);
 if(S.beads%108===0){S.sen+=20;bell();ticker("Bạn vừa tròn một chuỗi 108 hạt! +20 hạt sen")}
 ui();save();netTap()}
cv.addEventListener("pointerdown",function(e){moveTo(e.clientX,e.clientY)});
$("beadB").onclick=tap;
document.addEventListener("keydown",function(e){if(e.code==="Space"&&!/INPUT/.test(document.activeElement.tagName)&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();tap()}});
var at=null;$("auto").onclick=function(){if(at){clearInterval(at);at=null}else at=setInterval(function(){tap();qp("tung")},900);this.setAttribute("aria-pressed",!!at)};
$("bow").onclick=function(){me.bow=1;tone(300,200,.5,.4);S.sen++;pop("Lạy Phật +1 hạt sen",W/2,H*.6);ui();save()};
var medT=null;$("med").onclick=function(){if(medT)return;var n=0,b=this;b.disabled=true;medT=setInterval(function(){n++;b.lastChild.textContent="Thiền "+(10-n)+"s";me.glow=.6;if(n>=10){clearInterval(medT);medT=null;b.disabled=false;b.lastChild.textContent="Thiền";S.beads+=10;S.sen+=2;addExp(10);qp("thien");bowl();pop("Thiền xong +10 hạt",W/2,H*.6);ui();save()}},1000)};
$("off").onclick=function(){if(S.sen<5){ticker("Cần 5 hạt sen để dâng lễ");return}S.sen-=5;S.lamps++;qp("le");addExp(10);ticker("Bạn đã dâng lễ hoa sen. Công đức vô lượng!");tone(500,500,1,.3);ui();save()};
$("sndB").onclick=function(){S.snd=!S.snd;this.setAttribute("aria-pressed",S.snd);save()};
$("sndB").setAttribute("aria-pressed",S.snd);

var wishes=[["Nguyện cho gia đình bình an, công việc thuận lợi","Mỹ Khoa Huệ Sa",3],["Cầu cho gia đình bình an mạnh khỏe","Khôi Bạch Nhân Thu",1],["Nguyện cho gia đình bình an","Thanh Sơn Kỳ",2]];
function rw(){var h="";wishes.forEach(function(w,i){h+='<div class="w"><i>“'+esc(w[0])+'”</i><b>'+esc(w[1])+'</b><button data-i="'+i+'">🪷 '+w[2]+'</button></div>'});$("wl").innerHTML=h}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
$("wl").onclick=function(e){var b=e.target.closest("button");if(b){var w=wishes[b.dataset.i];w[2]++;if(net.db&&w[3])net.db.doc("wishes/"+w[3]).update({lit:w[2]}).catch(function(){});rw()}};
$("lampBtn").onclick=function(){$("panel").classList.toggle("on")};
$("wbtn").onclick=function(){$("wi").style.display="flex";$("wt").focus()};
$("wsend").onclick=function(){var v=$("wt").value.trim();if(!v)return;wishes.unshift([v,S.name,0]);if(net.db)net.db.collection("wishes").add({text:v,name:S.name,lit:0,t:Date.now()}).catch(function(){});S.lamps++;qp("den");addExp(15);$("wt").value="";$("wi").style.display="none";rw();ui();save();ticker("Đèn nguyện của bạn đã được thắp sáng")};
rw();

var M=$("modal"),B=$("mbox");M.onclick=function(e){if(e.target===M)M.classList.remove("on")};
document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){var k=b.dataset.s,h="";
 if(k==="rank"){var l=(net.rank||bots.map(function(m){return[m.name,m.beads]}).concat([[S.name+" (bạn)",S.exp|0]])).sort(function(a,b){return b[1]-a[1]}).slice(0,10);h="<h2>🏆 Xếp hạng</h2>"+l.map(function(r,i){return'<div class="rk"><span>'+(i+1)+". "+esc(r[0])+"</span><b>"+"Lv "+lvOf(r[1])+" · "+r[1].toLocaleString("vi-VN")+" exp</b></div>"}).join("")}
 else if(k==="set"){h='<h2>⚙️ Cài đặt</h2><label>Pháp danh / tên hiển thị<input type="text" id="nm" maxlength="20" value="'+esc(S.name)+'"></label><button class="gold" id="ok" style="width:100%">Lưu</button>'}
 else h="<h2>Sắp ra mắt</h2><p>Tính năng này đang được phát triển.</p>";
 B.innerHTML=h;M.classList.add("on");var ok=$("ok");if(ok)ok.onclick=function(){S.name=($("nm").value.trim()||"Đạo hữu");S.named=1;save();ui();net.dirty=true;if(net.room)net.room.presence({name:S.name,beads:S.beads}).catch(function(){});M.classList.remove("on")}}});

var on=104;setInterval(function(){if(net.room){showOn();return}on=Math.max(60,on+((Math.random()*5)|0)-2);$("online").textContent="● "+on+" đang online"},4000);
$("online").textContent="● "+on+" đang online";
setInterval(function(){var m=bots[(Math.random()*bots.length)|0];if(!m.real){m.glow=1;m.beads+=1+((Math.random()*3)|0)}},700);
setInterval(function(){var m=bots[(Math.random()*bots.length)|0];if(!net.room)ticker(m.name+" vừa tròn một chuỗi 108 hạt")},9000);

function loop(){t+=.016;bots.forEach(function(m){m.glow=Math.max(0,m.glow-.02)});me.glow=Math.max(0,me.glow-.03);me.bow=Math.max(0,me.bow-.04);scene();requestAnimationFrame(loop)}
bots.forEach(function(m){m.bn=m.name});
function showOn(){$("online").textContent="● "+Object.keys(net.peers).length+" đang online"}

    function setMode(m) { mode = m; $('np_p2').style.display = m === 'reg' ? 'block' : 'none'; $('np_go').textContent = m === 'reg' ? 'Đăng ký' : 'Đăng nhập'; $('np_t1').style.background = m === 'login' ? 'rgba(240,197,102,.25)' : 'transparent'; $('np_t2').style.background = m === 'reg' ? 'rgba(240,197,102,.25)' : 'transparent'; $('np_e').textContent = ''; }

      b.onclick = function () { flush(); send({ t: 'logout', token: token }); try { localStorage.removeItem('np_token'); localStorage.removeItem(KEY); } catch (e) {} setTimeout(function () { location.reload(); }, 300); };
      document.body.appendChild(b);
